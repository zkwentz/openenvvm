name: Benchmark All Providers

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run daily at midnight
    - cron: '0 0 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build openenvvm
        run: |
          cargo build --release
          sudo cp target/release/openenvvm /usr/local/bin/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sandbox-bench
        run: |
          pip install git+https://github.com/zkwentz/sandbox-bench.git@feature/openenv-providers
          pip install requests

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            sudo chmod 666 /dev/kvm
            sudo usermod -aG kvm $USER
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Checkout OpenEnv
        uses: actions/checkout@v4
        with:
          repository: meta-pytorch/OpenEnv
          path: OpenEnv

      - name: Build echo_env Docker image
        run: |
          cd OpenEnv/envs/echo_env

          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'EOF'
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app/env
          RUN pip install fastapi uvicorn
          RUN if [ -f /app/env/server/requirements.txt ]; then pip install -r /app/env/server/requirements.txt; fi
          EXPOSE 8000
          CMD ["uvicorn", "env.server.app:app", "--host", "0.0.0.0", "--port", "8000"]
          EOF
          fi

          docker build -t echo_env:latest .

      - name: Convert echo_env to MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          openenvvm convert ./OpenEnv/envs/echo_env -o echo_env.microvm
          ls -la echo_env.microvm/

      - name: Run sandbox-bench - All providers
        id: benchmark
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          DOCKER_IMAGE: echo_env:latest
          MICROVM_COMMAND: "openenvvm run ./echo_env.microvm --port {port} --ip {ip}"
        run: |
          # Build provider list based on available credentials
          PROVIDERS=""

          # Always test local providers
          PROVIDERS="--provider docker-image"

          if [ "${{ steps.kvm.outputs.available }}" == "true" ]; then
            PROVIDERS="$PROVIDERS --provider microvm"
          fi

          # Add cloud providers if keys available
          if [ -n "$E2B_API_KEY" ]; then
            PROVIDERS="$PROVIDERS --provider e2b"
          fi

          if [ -n "$DAYTONA_API_KEY" ]; then
            PROVIDERS="$PROVIDERS --provider daytona"
          fi

          if [ -n "$MODAL_TOKEN_ID" ]; then
            PROVIDERS="$PROVIDERS --provider modal"
          fi

          echo "Running: sandbox-bench run $PROVIDERS --runs 3"
          sandbox-bench run $PROVIDERS --runs 3 --output benchmark-results.json || true

          if [ -f benchmark-results.json ]; then
            cat benchmark-results.json
          fi

      - name: Generate results summary
        id: results
        run: |
          python3 << 'PYTHON'
          import json
          import os
          from datetime import datetime

          results_file = "benchmark-results.json"
          if not os.path.exists(results_file):
              print("No results file found")
              exit(0)

          with open(results_file) as f:
              data = json.load(f)

          results = data.get("results", [])
          if not results:
              print("No results in file")
              exit(0)

          # Generate markdown table
          md = []
          md.append("| Provider | Time | Tool Calls | Errors | Score | Grade |")
          md.append("|----------|------|------------|--------|-------|-------|")

          for r in sorted(results, key=lambda x: x.get("score", 0), reverse=True):
              provider = r.get("provider", "unknown")
              time_s = r.get("total_time_seconds", 0)
              if time_s >= 60:
                  time_str = f"{int(time_s // 60)}m {int(time_s % 60)}s"
              else:
                  time_str = f"{time_s:.1f}s"
              calls = r.get("tool_calls", 0)
              errors = r.get("errors", 0)
              score = r.get("score", 0)
              grade = r.get("grade", "?")

              md.append(f"| {provider} | {time_str} | {calls} | {errors} | {score:.1f} | {grade} |")

          table = "\n".join(md)

          # Find docker-image and microvm results for comparison
          docker_result = next((r for r in results if r["provider"] == "docker-image"), None)
          microvm_result = next((r for r in results if r["provider"] == "microvm"), None)

          comparison = ""
          if docker_result and microvm_result:
              docker_time = docker_result.get("total_time_seconds", 1)
              microvm_time = microvm_result.get("total_time_seconds", 1)
              if microvm_time > 0:
                  speedup = docker_time / microvm_time
                  comparison = f"\n**MicroVM is {speedup:.1f}x faster than Docker** ({docker_time:.1f}s vs {microvm_time:.1f}s)"

          # Write outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              # Use delimiter for multiline
              f.write(f"table<<EOF\n{table}\nEOF\n")
              f.write(f"comparison<<EOF\n{comparison}\nEOF\n")
              f.write(f"date={datetime.now().strftime('%Y-%m-%d %H:%M UTC')}\n")

          print("Generated results:")
          print(table)
          print(comparison)
          PYTHON

      - name: Update README with results
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 << 'PYTHON'
          import re
          import os

          table = os.environ.get("RESULTS_TABLE", "")
          comparison = os.environ.get("RESULTS_COMPARISON", "")
          date = os.environ.get("RESULTS_DATE", "")

          if not table:
              print("No results to update")
              exit(0)

          with open("README.md", "r") as f:
              readme = f.read()

          # Create the new benchmark section
          new_section = f'''## Latest Benchmark Results

*Last updated: {date}*

{table}
{comparison}

> Benchmarks run automatically in CI using [sandbox-bench](https://github.com/zkwentz/sandbox-bench).
> See [workflow runs](https://github.com/zkwentz/openenvvm/actions/workflows/benchmark.yml) for details.

## Performance'''

          # Replace the section between "## Latest Benchmark Results" or "## Performance Results" and "## Performance" or "## Quick Start"
          # First, try to find existing "Latest Benchmark Results" section
          pattern = r'## Latest Benchmark Results.*?(?=## Performance\b|## Quick Start)'
          if re.search(pattern, readme, re.DOTALL):
              readme = re.sub(pattern, new_section + "\n\n", readme, flags=re.DOTALL)
          else:
              # Try to find "Performance Results" section
              pattern = r'## Performance Results.*?(?=## Quick Start)'
              if re.search(pattern, readme, re.DOTALL):
                  readme = re.sub(pattern, new_section + "\n\n## Quick Start", readme, flags=re.DOTALL)
              else:
                  # Insert after the first heading
                  pattern = r'(# OpenEnvVM\n\n\[.*?\]\n\n.*?\n\n)'
                  if re.search(pattern, readme, re.DOTALL):
                      readme = re.sub(pattern, r'\1' + new_section + "\n\n", readme, flags=re.DOTALL)

          with open("README.md", "w") as f:
              f.write(readme)

          print("README updated successfully")
          PYTHON
        env:
          RESULTS_TABLE: ${{ steps.results.outputs.table }}
          RESULTS_COMPARISON: ${{ steps.results.outputs.comparison }}
          RESULTS_DATE: ${{ steps.results.outputs.date }}

      - name: Commit and push README updates
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update benchmark results in README [skip ci]"
            git push
          fi

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.json
          retention-days: 90

      - name: Generate GitHub Summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.results.outputs.table }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.results.outputs.comparison }}" >> $GITHUB_STEP_SUMMARY
