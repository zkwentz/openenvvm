name: Benchmark Docker vs MicroVM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the openenvvm binary
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openenvvm-binary
          path: target/release/openenvvm
          retention-days: 1

  # Benchmark each environment
  benchmark:
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - echo_env
          - chat_env
          - connect4_env
          - grid_world_env
          - maze_env
          - snake_env

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            ls -la /dev/kvm
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KVM is NOT available"
          fi

      - name: Setup KVM permissions
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/openenvvm

      - name: Checkout OpenEnv
        uses: actions/checkout@v4
        with:
          repository: meta-pytorch/OpenEnv
          path: OpenEnv

      - name: Build Docker image for ${{ matrix.env }}
        id: docker_build
        run: |
          cd OpenEnv/envs/${{ matrix.env }}

          # Check if Dockerfile exists, if not create one
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'DOCKERFILE'
          FROM python:3.11-slim
          WORKDIR /app
          COPY . /app/env
          RUN pip install fastapi uvicorn
          RUN if [ -f /app/env/server/requirements.txt ]; then pip install -r /app/env/server/requirements.txt; fi
          EXPOSE 8000
          CMD ["uvicorn", "env.server.app:app", "--host", "0.0.0.0", "--port", "8000"]
          DOCKERFILE
          fi

          docker build -t ${{ matrix.env }}:latest .
          echo "image=${{ matrix.env }}:latest" >> $GITHUB_OUTPUT

      - name: Convert to MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          ./bin/openenvvm convert ./OpenEnv/envs/${{ matrix.env }} -o ${{ matrix.env }}.microvm

      - name: Run Docker benchmark
        id: docker_bench
        run: |
          echo "Running Docker benchmark for ${{ matrix.env }}..."

          # Start container
          START=$(date +%s%N)
          CONTAINER_ID=$(docker run -d -p 8100:8000 ${{ matrix.env }}:latest)

          # Wait for health
          for i in {1..60}; do
            if curl -sf http://localhost:8100/health > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          BOOT_TIME=$(( ($(date +%s%N) - $START) / 1000000 ))

          # Test reset
          START=$(date +%s%N)
          curl -sf -X POST http://localhost:8100/reset -H "Content-Type: application/json" -d '{}' || true
          RESET_TIME=$(( ($(date +%s%N) - $START) / 1000000 ))

          # Cleanup
          docker rm -f $CONTAINER_ID > /dev/null

          echo "docker_boot_ms=$BOOT_TIME" >> $GITHUB_OUTPUT
          echo "docker_reset_ms=$RESET_TIME" >> $GITHUB_OUTPUT
          echo "Docker: boot=${BOOT_TIME}ms, reset=${RESET_TIME}ms"

      - name: Run MicroVM benchmark
        id: microvm_bench
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "Running MicroVM benchmark for ${{ matrix.env }}..."

          # Start VM
          START=$(date +%s%N)
          sudo ./bin/openenvvm run ${{ matrix.env }}.microvm --port 8000 &
          VM_PID=$!

          # Wait for health
          for i in {1..60}; do
            if curl -sf http://172.16.0.2:8000/health > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          BOOT_TIME=$(( ($(date +%s%N) - $START) / 1000000 ))

          # Test reset
          START=$(date +%s%N)
          curl -sf -X POST http://172.16.0.2:8000/reset -H "Content-Type: application/json" -d '{}' || true
          RESET_TIME=$(( ($(date +%s%N) - $START) / 1000000 ))

          # Cleanup
          sudo kill $VM_PID 2>/dev/null || true

          echo "microvm_boot_ms=$BOOT_TIME" >> $GITHUB_OUTPUT
          echo "microvm_reset_ms=$RESET_TIME" >> $GITHUB_OUTPUT
          echo "MicroVM: boot=${BOOT_TIME}ms, reset=${RESET_TIME}ms"

      - name: Calculate speedup
        id: speedup
        run: |
          DOCKER_BOOT=${{ steps.docker_bench.outputs.docker_boot_ms }}
          MICROVM_BOOT=${{ steps.microvm_bench.outputs.microvm_boot_ms || '0' }}

          if [ "$MICROVM_BOOT" != "0" ] && [ "$MICROVM_BOOT" != "" ]; then
            SPEEDUP=$(echo "scale=2; $DOCKER_BOOT / $MICROVM_BOOT" | bc)
            echo "boot_speedup=${SPEEDUP}x" >> $GITHUB_OUTPUT
            echo "Boot speedup: ${SPEEDUP}x"
          else
            echo "boot_speedup=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Save benchmark result
        run: |
          mkdir -p benchmark-results
          cat > benchmark-results/${{ matrix.env }}.json << EOF
          {
            "env": "${{ matrix.env }}",
            "docker": {
              "boot_ms": ${{ steps.docker_bench.outputs.docker_boot_ms }},
              "reset_ms": ${{ steps.docker_bench.outputs.docker_reset_ms }}
            },
            "microvm": {
              "boot_ms": ${{ steps.microvm_bench.outputs.microvm_boot_ms || 'null' }},
              "reset_ms": ${{ steps.microvm_bench.outputs.microvm_reset_ms || 'null' }}
            },
            "speedup": "${{ steps.speedup.outputs.boot_speedup }}"
          }
          EOF
          cat benchmark-results/${{ matrix.env }}.json

      - name: Upload benchmark result
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.env }}
          path: benchmark-results/${{ matrix.env }}.json
          retention-days: 90

  # Aggregate results and create summary
  summary:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          path: benchmark-results
          pattern: benchmark-*
          merge-multiple: true

      - name: Generate summary
        run: |
          echo "## Benchmark Results: Docker vs MicroVM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Docker Boot | MicroVM Boot | Speedup |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------------|--------------|---------|" >> $GITHUB_STEP_SUMMARY

          TOTAL_DOCKER=0
          TOTAL_MICROVM=0
          COUNT=0

          for f in benchmark-results/*.json; do
            if [ -f "$f" ]; then
              ENV=$(jq -r '.env' "$f")
              DOCKER_BOOT=$(jq -r '.docker.boot_ms' "$f")
              MICROVM_BOOT=$(jq -r '.microvm.boot_ms' "$f")
              SPEEDUP=$(jq -r '.speedup' "$f")

              echo "| $ENV | ${DOCKER_BOOT}ms | ${MICROVM_BOOT}ms | $SPEEDUP |" >> $GITHUB_STEP_SUMMARY

              if [ "$MICROVM_BOOT" != "null" ]; then
                TOTAL_DOCKER=$((TOTAL_DOCKER + DOCKER_BOOT))
                TOTAL_MICROVM=$((TOTAL_MICROVM + MICROVM_BOOT))
                COUNT=$((COUNT + 1))
              fi
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $COUNT -gt 0 ]; then
            AVG_DOCKER=$((TOTAL_DOCKER / COUNT))
            AVG_MICROVM=$((TOTAL_MICROVM / COUNT))
            AVG_SPEEDUP=$(echo "scale=2; $AVG_DOCKER / $AVG_MICROVM" | bc)

            echo "### Average Performance" >> $GITHUB_STEP_SUMMARY
            echo "- **Average Docker boot:** ${AVG_DOCKER}ms" >> $GITHUB_STEP_SUMMARY
            echo "- **Average MicroVM boot:** ${AVG_MICROVM}ms" >> $GITHUB_STEP_SUMMARY
            echo "- **Average speedup:** ${AVG_SPEEDUP}x faster" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Create aggregated results JSON
        run: |
          echo '{"benchmarks": [' > benchmark-results/all.json
          first=true
          for f in benchmark-results/*.json; do
            if [ -f "$f" ] && [ "$f" != "benchmark-results/all.json" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> benchmark-results/all.json
              fi
              cat "$f" >> benchmark-results/all.json
            fi
          done
          echo ']}' >> benchmark-results/all.json

          cat benchmark-results/all.json

      - name: Upload aggregated results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-all
          path: benchmark-results/all.json
          retention-days: 90
