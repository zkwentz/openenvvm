name: Build OpenEnv MicroVMs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the openenvvm binary first
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openenvvm-binary
          path: target/release/openenvvm
          retention-days: 1

  # Build each environment in parallel
  build-env:
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - atari_env
          - browsergym_env
          - calendar_env
          - chat_env
          - chess_env
          - coding_env
          - connect4_env
          - dipg_safety_env
          - dm_control_env
          - echo_env
          - finqa_env
          - finrl_env
          - git_env
          - grid_world_env
          - julia_env
          - kernrl
          - maze_env
          - openapp_env
          - openspiel_env
          - reasoning_gym_env
          - repl_env
          - snake_env
          - sumo_rl_env
          - tbench2_env
          - textarena_env
          - unity_env
          - websearch_env
          - wildfire_env

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/openenvvm

      - name: Checkout OpenEnv
        uses: actions/checkout@v4
        with:
          repository: meta-pytorch/OpenEnv
          path: OpenEnv

      - name: Convert ${{ matrix.env }} to MicroVM
        run: |
          ./bin/openenvvm convert ./OpenEnv/envs/${{ matrix.env }} -o ${{ matrix.env }}.microvm
          ls -la ${{ matrix.env }}.microvm/
          cat ${{ matrix.env }}.microvm/metadata.json

      - name: Upload MicroVM package
        uses: actions/upload-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ${{ matrix.env }}.microvm/
          retention-days: 7

  # Test the MicroVMs with Firecracker (requires KVM)
  # Tests environments that have validation scripts
  test-env:
    needs: build-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - echo_env
          - chat_env
          - connect4_env
          - grid_world_env
          - maze_env
          - snake_env

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            ls -la /dev/kvm
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KVM is NOT available - skipping VM tests"
          fi

      - name: Setup KVM permissions
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Set up Python
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        if: steps.kvm.outputs.available == 'true'
        run: pip install requests

      - name: Download binary
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        if: steps.kvm.outputs.available == 'true'
        run: chmod +x ./bin/openenvvm

      - name: Download MicroVM package
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ./${{ matrix.env }}.microvm

      - name: Verify MicroVM package contents
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "=== Package contents ==="
          ls -la ${{ matrix.env }}.microvm/
          echo ""
          echo "=== Config.json ==="
          cat ${{ matrix.env }}.microvm/config.json
          echo ""
          echo "=== Checking files ==="
          file ${{ matrix.env }}.microvm/vmlinux || echo "vmlinux file check failed"
          file ${{ matrix.env }}.microvm/rootfs.ext4 || echo "rootfs file check failed"

      - name: Start ${{ matrix.env }} MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Start the VM in background with verbose output
          sudo ./bin/openenvvm run ${{ matrix.env }}.microvm --port 8000 2>&1 &
          echo $! > /tmp/vm.pid

          # Wait for VM to be ready
          echo "Waiting for VM to boot..."
          sleep 20

      - name: Validate ${{ matrix.env }} MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          python scripts/validate_microvm.py \
            --env ${{ matrix.env }} \
            --url http://172.16.0.2:8000 \
            --timeout 60

      - name: Cleanup
        if: always() && steps.kvm.outputs.available == 'true'
        run: |
          if [ -f /tmp/vm.pid ]; then
            sudo kill $(cat /tmp/vm.pid) 2>/dev/null || true
          fi

  # Test additional environments with basic validation
  test-env-basic:
    needs: build-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - chess_env
          - finqa_env
          - repl_env
          - textarena_env
          - calendar_env

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KVM is NOT available - skipping VM tests"
          fi

      - name: Setup KVM permissions
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker

      - name: Set up Python
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        if: steps.kvm.outputs.available == 'true'
        run: pip install requests

      - name: Download binary
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        if: steps.kvm.outputs.available == 'true'
        run: chmod +x ./bin/openenvvm

      - name: Download MicroVM package
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ./${{ matrix.env }}.microvm

      - name: Verify MicroVM package contents
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "=== Package contents ==="
          ls -la ${{ matrix.env }}.microvm/
          echo ""
          echo "=== Config.json ==="
          cat ${{ matrix.env }}.microvm/config.json

      - name: Test ${{ matrix.env }} MicroVM (basic)
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Start the VM in background with verbose output
          sudo ./bin/openenvvm run ${{ matrix.env }}.microvm --port 8000 2>&1 &
          VM_PID=$!

          # Wait for VM to boot
          sleep 20

          # Run basic validation (generic validator)
          python scripts/validate_microvm.py \
            --env ${{ matrix.env }} \
            --url http://172.16.0.2:8000 \
            --timeout 60 || true

          # Cleanup
          sudo kill $VM_PID 2>/dev/null || true

  # Summary job
  summary:
    needs: [build-env, test-env, test-env-basic]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## MicroVM Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All OpenEnv environments have been converted to MicroVM packages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Results" >> $GITHUB_STEP_SUMMARY
          echo "28 environments built and packaged as MicroVMs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validation Tests" >> $GITHUB_STEP_SUMMARY
          echo "The following environments were validated with Firecracker:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Full validation (MCP tools + step):**" >> $GITHUB_STEP_SUMMARY
          echo "- echo_env" >> $GITHUB_STEP_SUMMARY
          echo "- chat_env" >> $GITHUB_STEP_SUMMARY
          echo "- connect4_env" >> $GITHUB_STEP_SUMMARY
          echo "- grid_world_env" >> $GITHUB_STEP_SUMMARY
          echo "- maze_env" >> $GITHUB_STEP_SUMMARY
          echo "- snake_env" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Basic validation (health + reset):**" >> $GITHUB_STEP_SUMMARY
          echo "- chess_env" >> $GITHUB_STEP_SUMMARY
          echo "- finqa_env" >> $GITHUB_STEP_SUMMARY
          echo "- repl_env" >> $GITHUB_STEP_SUMMARY
          echo "- textarena_env" >> $GITHUB_STEP_SUMMARY
          echo "- calendar_env" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "MicroVM packages are available as workflow artifacts (7-day retention)." >> $GITHUB_STEP_SUMMARY
