name: Build OpenEnv MicroVMs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the openenvvm binary first
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openenvvm-binary
          path: target/release/openenvvm
          retention-days: 1

  # Build each environment in parallel
  build-env:
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - atari_env
          - browsergym_env
          - calendar_env
          - chat_env
          - chess_env
          - coding_env
          - connect4_env
          - dipg_safety_env
          - dm_control_env
          - echo_env
          - finqa_env
          - finrl_env
          - git_env
          - grid_world_env
          - julia_env
          - kernrl
          - maze_env
          - openapp_env
          - openspiel_env
          - reasoning_gym_env
          - repl_env
          - snake_env
          - sumo_rl_env
          - tbench2_env
          - textarena_env
          - unity_env
          - websearch_env
          - wildfire_env

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/openenvvm

      - name: Checkout OpenEnv
        uses: actions/checkout@v4
        with:
          repository: openenv/OpenEnv
          path: OpenEnv

      - name: Convert ${{ matrix.env }} to MicroVM
        run: |
          ./bin/openenvvm convert ./OpenEnv/envs/${{ matrix.env }} -o ${{ matrix.env }}.microvm
          ls -la ${{ matrix.env }}.microvm/
          cat ${{ matrix.env }}.microvm/metadata.json

      - name: Upload MicroVM package
        uses: actions/upload-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ${{ matrix.env }}.microvm/
          retention-days: 7

  # Test the MicroVMs with Firecracker (requires KVM)
  test-env:
    needs: build-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Start with simple environments for testing
        env:
          - echo_env
          - chat_env
          - connect4_env

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            ls -la /dev/kvm
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KVM is NOT available - skipping VM tests"
          fi

      - name: Setup KVM permissions
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Download binary
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        if: steps.kvm.outputs.available == 'true'
        run: chmod +x ./bin/openenvvm

      - name: Download MicroVM package
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ./${{ matrix.env }}.microvm

      - name: Test ${{ matrix.env }} MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Start the VM in background
          timeout 60 ./bin/openenvvm run ${{ matrix.env }}.microvm --port 8000 &
          VM_PID=$!

          # Wait for VM to be ready
          sleep 15

          # Test health endpoint
          for i in {1..10}; do
            if curl -sf http://172.16.0.2:8000/health; then
              echo "Health check passed!"
              break
            fi
            echo "Attempt $i failed, waiting..."
            sleep 2
          done

          # Test reset endpoint
          curl -sf -X POST http://172.16.0.2:8000/reset || echo "Reset endpoint test completed"

          # Cleanup
          kill $VM_PID 2>/dev/null || true

  # Summary job
  summary:
    needs: [build-env, test-env]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## MicroVM Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All OpenEnv environments have been converted to MicroVM packages." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Available Packages" >> $GITHUB_STEP_SUMMARY
          echo "- atari_env" >> $GITHUB_STEP_SUMMARY
          echo "- browsergym_env" >> $GITHUB_STEP_SUMMARY
          echo "- calendar_env" >> $GITHUB_STEP_SUMMARY
          echo "- chat_env" >> $GITHUB_STEP_SUMMARY
          echo "- chess_env" >> $GITHUB_STEP_SUMMARY
          echo "- coding_env" >> $GITHUB_STEP_SUMMARY
          echo "- connect4_env" >> $GITHUB_STEP_SUMMARY
          echo "- dipg_safety_env" >> $GITHUB_STEP_SUMMARY
          echo "- dm_control_env" >> $GITHUB_STEP_SUMMARY
          echo "- echo_env" >> $GITHUB_STEP_SUMMARY
          echo "- finqa_env" >> $GITHUB_STEP_SUMMARY
          echo "- finrl_env" >> $GITHUB_STEP_SUMMARY
          echo "- git_env" >> $GITHUB_STEP_SUMMARY
          echo "- grid_world_env" >> $GITHUB_STEP_SUMMARY
          echo "- julia_env" >> $GITHUB_STEP_SUMMARY
          echo "- kernrl" >> $GITHUB_STEP_SUMMARY
          echo "- maze_env" >> $GITHUB_STEP_SUMMARY
          echo "- openapp_env" >> $GITHUB_STEP_SUMMARY
          echo "- openspiel_env" >> $GITHUB_STEP_SUMMARY
          echo "- reasoning_gym_env" >> $GITHUB_STEP_SUMMARY
          echo "- repl_env" >> $GITHUB_STEP_SUMMARY
          echo "- snake_env" >> $GITHUB_STEP_SUMMARY
          echo "- sumo_rl_env" >> $GITHUB_STEP_SUMMARY
          echo "- tbench2_env" >> $GITHUB_STEP_SUMMARY
          echo "- textarena_env" >> $GITHUB_STEP_SUMMARY
          echo "- unity_env" >> $GITHUB_STEP_SUMMARY
          echo "- websearch_env" >> $GITHUB_STEP_SUMMARY
          echo "- wildfire_env" >> $GITHUB_STEP_SUMMARY
