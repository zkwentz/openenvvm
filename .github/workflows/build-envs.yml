name: Build OpenEnv MicroVMs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the openenvvm binary first
  build-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: openenvvm-binary
          path: target/release/openenvvm
          retention-days: 1

  # Build each environment in parallel
  build-env:
    needs: build-binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - atari_env
          - browsergym_env
          - calendar_env
          - chat_env
          - chess_env
          - coding_env
          - connect4_env
          - dipg_safety_env
          - dm_control_env
          - echo_env
          - finqa_env
          - finrl_env
          - git_env
          - grid_world_env
          - julia_env
          - kernrl
          - maze_env
          - openapp_env
          - openspiel_env
          - reasoning_gym_env
          - repl_env
          - snake_env
          - sumo_rl_env
          - tbench2_env
          - textarena_env
          - unity_env
          - websearch_env
          - wildfire_env

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/openenvvm

      - name: Checkout OpenEnv
        uses: actions/checkout@v4
        with:
          repository: meta-pytorch/OpenEnv
          path: OpenEnv

      - name: Convert ${{ matrix.env }} to MicroVM
        run: |
          ./bin/openenvvm convert ./OpenEnv/envs/${{ matrix.env }} -o ${{ matrix.env }}.microvm
          ls -la ${{ matrix.env }}.microvm/
          cat ${{ matrix.env }}.microvm/metadata.json

      - name: Upload MicroVM package
        uses: actions/upload-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ${{ matrix.env }}.microvm/
          retention-days: 7

  # Test the MicroVMs with Firecracker (requires KVM)
  # Generic validator discovers action format from /schema, observation, and 422 probing
  test-env:
    needs: build-env
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - atari_env
          - browsergym_env
          - calendar_env
          - chat_env
          - chess_env
          - coding_env
          - connect4_env
          - dipg_safety_env
          - dm_control_env
          - echo_env
          - finqa_env
          - finrl_env
          - git_env
          - grid_world_env
          - julia_env
          - kernrl
          - maze_env
          - openapp_env
          - openspiel_env
          - reasoning_gym_env
          - repl_env
          - snake_env
          - sumo_rl_env
          - tbench2_env
          - textarena_env
          - unity_env
          - websearch_env
          - wildfire_env

    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            ls -la /dev/kvm
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "KVM is NOT available - skipping VM tests"
          fi

      - name: Setup KVM permissions
        if: steps.kvm.outputs.available == 'true'
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        if: steps.kvm.outputs.available == 'true'
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Set up Python
        if: steps.kvm.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        if: steps.kvm.outputs.available == 'true'
        run: pip install requests

      - name: Download binary
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: openenvvm-binary
          path: ./bin

      - name: Make binary executable
        if: steps.kvm.outputs.available == 'true'
        run: chmod +x ./bin/openenvvm

      - name: Download MicroVM package
        if: steps.kvm.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: microvm-${{ matrix.env }}
          path: ./${{ matrix.env }}.microvm

      - name: Verify MicroVM package contents
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "=== Package contents ==="
          ls -la ${{ matrix.env }}.microvm/
          echo ""
          echo "=== Config.json ==="
          cat ${{ matrix.env }}.microvm/config.json
          echo ""
          echo "=== Checking files ==="
          file ${{ matrix.env }}.microvm/vmlinux || echo "vmlinux file check failed"
          file ${{ matrix.env }}.microvm/rootfs.ext4 || echo "rootfs file check failed"

      - name: Start ${{ matrix.env }} MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Start the VM in background, capturing output to a file
          sudo ./bin/openenvvm run ${{ matrix.env }}.microvm --port 8000 > /tmp/vm.log 2>&1 &
          echo $! > /tmp/vm.pid

          # Wait for VM to be ready
          echo "Waiting for VM to boot..."
          sleep 30

          # Show VM output
          echo "=== VM Output ==="
          cat /tmp/vm.log || true

      - name: Debug network connectivity
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "=== Host network state ==="
          ip addr show tap0 || true
          ip route || true

          echo ""
          echo "=== Check Firecracker process ==="
          ps aux | grep firecracker || true

          echo ""
          echo "=== Kernel messages (network) ==="
          sudo dmesg | tail -50 | grep -iE "(tap|kvm|net|eth)" || true

          echo ""
          echo "=== Ping test ==="
          ping -c 3 172.16.0.2 || true

          echo ""
          echo "=== Curl test ==="
          curl -v --connect-timeout 5 http://172.16.0.2:8000/health || true

      - name: Quick endpoint test
        if: steps.kvm.outputs.available == 'true'
        run: |
          echo "=== /health ==="
          curl -s http://172.16.0.2:8000/health 2>&1 || echo "(no response)"
          echo ""
          echo "=== /metadata ==="
          curl -s http://172.16.0.2:8000/metadata 2>&1 || echo "(no response)"
          echo ""
          echo "=== /reset ==="
          curl -s -X POST http://172.16.0.2:8000/reset -H 'Content-Type: application/json' -d '{}' 2>&1 || echo "(no response)"

      - name: Validate ${{ matrix.env }} MicroVM
        if: steps.kvm.outputs.available == 'true'
        run: |
          python scripts/validate_microvm.py \
            --env ${{ matrix.env }} \
            --url http://172.16.0.2:8000 \
            --timeout 60

      - name: Show VM logs on failure
        if: failure() && steps.kvm.outputs.available == 'true'
        run: |
          echo "=== Full VM Output ==="
          cat /tmp/vm.log 2>/dev/null || echo "No VM log found"
          echo ""
          echo "=== Last 5 seconds of health endpoint ==="
          for i in 1 2 3 4 5; do
            curl -s --connect-timeout 2 http://172.16.0.2:8000/health 2>&1 || echo "  (no response)"
            sleep 1
          done

      - name: Cleanup
        if: always() && steps.kvm.outputs.available == 'true'
        run: |
          if [ -f /tmp/vm.pid ]; then
            sudo kill $(cat /tmp/vm.pid) 2>/dev/null || true
          fi

  # Summary job - reports results and fails if any upstream job failed
  summary:
    needs: [build-env, test-env]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check upstream job results
        run: |
          echo "build-env result: ${{ needs.build-env.result }}"
          echo "test-env result: ${{ needs.test-env.result }}"

          if [ "${{ needs.build-env.result }}" = "failure" ] || \
             [ "${{ needs.test-env.result }}" = "failure" ]; then
            echo "::error::One or more upstream jobs failed!"
            exit 1
          fi

      - name: Build Summary
        run: |
          echo "## MicroVM Build & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "- build-env: ${{ needs.build-env.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- test-env: ${{ needs.test-env.result }}" >> $GITHUB_STEP_SUMMARY
