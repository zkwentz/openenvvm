name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: cargo test

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  # Test the convert command (requires Docker)
  test-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Create test environment
        run: |
          mkdir -p test-env/server
          cat > test-env/server/app.py << 'EOF'
          from fastapi import FastAPI
          app = FastAPI()

          @app.get("/health")
          def health():
              return {"status": "ok"}

          @app.post("/reset")
          def reset():
              return {"reset": True}

          @app.post("/echo")
          def echo(message: str = "hello"):
              return {"message": message}
          EOF

          cat > test-env/server/requirements.txt << 'EOF'
          fastapi
          EOF

      - name: Test convert command
        run: |
          ./target/release/openenv-microvm convert ./test-env -o test.microvm
          ls -la test.microvm/
          cat test.microvm/metadata.json
          cat test.microvm/config.json

      - name: Verify package contents
        run: |
          test -f test.microvm/vmlinux
          test -f test.microvm/rootfs.ext4
          test -f test.microvm/config.json
          test -f test.microvm/metadata.json
          echo "All package files present!"

  # Test running a microVM (requires KVM)
  test-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check KVM availability
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM is available!"
            ls -la /dev/kvm
          else
            echo "KVM is NOT available - skipping VM tests"
            exit 0
          fi

      - name: Setup KVM permissions
        run: |
          sudo chmod 666 /dev/kvm
          sudo usermod -aG kvm $USER

      - name: Install Firecracker
        run: |
          ARCH=$(uname -m)
          curl -L https://github.com/firecracker-microvm/firecracker/releases/download/v1.6.0/firecracker-v1.6.0-${ARCH}.tgz | tar xz
          sudo mv release-v1.6.0-${ARCH}/firecracker-v1.6.0-${ARCH} /usr/local/bin/firecracker
          firecracker --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Create test environment
        run: |
          mkdir -p test-env/server
          cat > test-env/server/app.py << 'EOF'
          from fastapi import FastAPI
          app = FastAPI()

          @app.get("/health")
          def health():
              return {"status": "ok"}

          @app.post("/reset")
          def reset():
              return {"reset": True}
          EOF

          cat > test-env/server/requirements.txt << 'EOF'
          fastapi
          EOF

      - name: Convert environment
        run: ./target/release/openenv-microvm convert ./test-env -o test.microvm

      - name: Test run command
        run: |
          # Start the VM in background
          timeout 60 ./target/release/openenv-microvm run test.microvm --port 8000 &
          VM_PID=$!

          # Wait for VM to be ready
          sleep 10

          # Test health endpoint
          curl -f http://172.16.0.2:8000/health || echo "Health check failed (expected if KVM not fully working)"

          # Cleanup
          kill $VM_PID 2>/dev/null || true
